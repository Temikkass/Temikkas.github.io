<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 March - Your Wish 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #e91e63;
            --secondary: #ff6f9c;
            --accent: #ffd700;
            --bg-dark: #0a0505;
            --bg-card: #1a0f0f;
            --text-light: #ffffff;
            --text-muted: #b8a8a8;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(135deg, #0a0505 0%, #1a0808 50%, #2a0d0d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Декоративные элементы фона */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(139, 0, 0, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(80, 20, 20, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(100, 0, 30, 0.1) 0%, transparent 40%);
            animation: float-bg 20s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes float-bg {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(5deg); }
            66% { transform: translate(-20px, 20px) rotate(-5deg); }
        }

        /* Падающие лепестки */
        .petals {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .petal {
            position: absolute;
            font-size: 25px;
            animation: fall linear infinite;
            opacity: 0.7;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .container {
            background: rgba(26, 15, 15, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 80px 60px;
            max-width: 700px;
            width: 100%;
            box-shadow: 
                0 30px 90px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(139, 0, 0, 0.3) inset,
                0 10px 40px rgba(233, 30, 99, 0.2);
            position: relative;
            z-index: 10;
            border: 3px solid rgba(139, 0, 0, 0.5);
        }

        /* Декоративные цветы по углам */
        .flower-decoration {
            position: absolute;
            font-size: 60px;
            opacity: 0.6;
            animation: rotate-flower 10s ease-in-out infinite;
        }

        .flower-top-left {
            top: -30px;
            left: -30px;
            transform: rotate(-15deg);
        }

        .flower-top-right {
            top: -30px;
            right: -30px;
            transform: rotate(15deg);
        }

        .flower-bottom-left {
            bottom: -30px;
            left: -30px;
            transform: rotate(165deg);
        }

        .flower-bottom-right {
            bottom: -30px;
            right: -30px;
            transform: rotate(-165deg);
        }

        @keyframes rotate-flower {
            0%, 100% { transform: rotate(-15deg) scale(1); }
            50% { transform: rotate(15deg) scale(1.1); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(233, 30, 99, 0.2);
            letter-spacing: -1px;
        }

        .subtitle {
            text-align: center;
            font-size: 1.8rem;
            color: var(--text-muted);
            margin-bottom: 50px;
            font-weight: 300;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 40px;
        }

        label {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--text-light);
            margin-bottom: 15px;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 25px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            border: 3px solid rgba(139, 0, 0, 0.6);
            border-radius: 20px;
            background: rgba(10, 5, 5, 0.6);
            color: var(--text-light);
            transition: all 0.3s ease;
            resize: vertical;
            line-height: 1.6;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(20, 10, 10, 0.8);
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.3);
            transform: translateY(-2px);
        }

        textarea::placeholder {
            color: rgba(184, 168, 168, 0.5);
            font-style: italic;
        }

        .button-container {
            text-align: center;
            margin-top: 40px;
        }

        button {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            padding: 25px 60px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 10px 30px rgba(233, 30, 99, 0.4),
                0 0 0 0 rgba(233, 30, 99, 0.4);
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 
                0 20px 50px rgba(233, 30, 99, 0.5),
                0 0 0 8px rgba(233, 30, 99, 0.1);
        }

        button:hover::before {
            left: 100%;
        }

        button:active {
            transform: translateY(-2px) scale(1.02);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Сообщение об успехе */
        .success-message {
            display: none;
            background: linear-gradient(135deg, #4caf50 0%, #8bc34a 100%);
            color: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            font-size: 1.4rem;
            margin-top: 30px;
            animation: slideIn 0.5s ease-out;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.3);
        }

        .error-message {
            display: none;
            background: linear-gradient(135deg, #f44336 0%, #e91e63 100%);
            color: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            font-size: 1.4rem;
            margin-top: 30px;
            animation: slideIn 0.5s ease-out;
            box-shadow: 0 10px 30px rgba(244, 67, 54, 0.3);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 50px 30px;
                border-radius: 30px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.3rem;
            }

            button {
                font-size: 1.3rem;
                padding: 20px 40px;
            }

            .flower-decoration {
                font-size: 40px;
            }
        }

        /* Инструкция по настройке */
        .setup-notice {
            background: rgba(255, 193, 7, 0.15);
            border: 2px solid rgba(255, 193, 7, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            font-size: 1.1rem;
            color: var(--text-dark);
        }

        .setup-notice strong {
            color: var(--primary);
        }

        .setup-notice code {
            background: rgba(255, 255, 255, 0.6);
            padding: 2px 8px;
            border-radius: 5px;
            font-family: monospace;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="petals" id="petals"></div>

    <div class="container">
        <div class="flower-decoration flower-top-left">🌸</div>
        <div class="flower-decoration flower-top-right">🌺</div>
        <div class="flower-decoration flower-bottom-left">🌼</div>
        <div class="flower-decoration flower-bottom-right">🌷</div>

        <h1>My Dear</h1>
        <p class="subtitle">What do you want for 8 March? 🌹</p>

        <form id="wishForm">
            <div class="form-group">
                <label for="wish">Your Wish:</label>
                <textarea 
                    id="wish" 
                    name="wish" 
                    placeholder="Write your wish here... ✨"
                    required
                    maxlength="1000"
                ></textarea>
            </div>

            <div class="button-container">
                <button type="submit" id="submitBtn">
                    Submit the Wish 💝
                </button>
            </div>

            <div class="success-message" id="successMessage">
                ✨ Your wish has been sent successfully! ✨
            </div>

            <div class="error-message" id="errorMessage">
                ⚠️ Something went wrong. Please try again.
            </div>
        </form>
    </div>

    <script>
        // Создание падающих лепестков
        const petalsContainer = document.getElementById('petals');
        const petalEmojis = ['🌸', '🌺', '🌼', '🌷', '🌹', '💐', '🏵️'];

        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            petal.innerHTML = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
            petal.style.left = Math.random() * 100 + '%';
            petal.style.animationDuration = (Math.random() * 3 + 4) + 's';
            petal.style.fontSize = (Math.random() * 15 + 20) + 'px';
            petalsContainer.appendChild(petal);

            setTimeout(() => {
                petal.remove();
            }, 7000);
        }

        setInterval(createPetal, 200);

        // Обработка формы
        const form = document.getElementById('wishForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const wish = document.getElementById('wish').value.trim();
            
            if (!wish) {
                return;
            }

            // Отключаем кнопку во время отправки
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending... ✉️';
            
            // Скрываем предыдущие сообщения
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';

            try {
                // ВАЖНО: Замените YOUR_EMAIL@gmail.com на свой email!
                const response = await fetch('https://formsubmit.co/ajax/x192acc@gmail.com', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        name: '8 March Wish 🌸',
                        message: wish,
                        _subject: '💐 New 8 March Wish Received!',
                        _template: 'box'
                    })
                });

                if (response.ok) {
                    successMessage.style.display = 'block';
                    document.getElementById('wish').value = '';
                    
                    // Создаём много лепестков при успехе
                    for(let i = 0; i < 30; i++) {
                        setTimeout(createPetal, i * 50);
                    }
                } else {
                    throw new Error('Failed to send');
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit the Wish 💝';
            }
        });

        // Счётчик символов
        const textarea = document.getElementById('wish');
        textarea.addEventListener('input', function() {
            const remaining = 1000 - this.value.length;
            if (remaining < 100) {
                // Можно добавить индикатор оставшихся символов
            }
        });
    </script>
</body>
</html>
